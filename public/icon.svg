<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect x="2" y="2" width="60" height="60" fill="#C0C0C0" />

  <!-- Outer Win95 frame -->
  <rect x="6" y="8" width="52" height="48" fill="#C0C0C0" />
  <rect x="6" y="8" width="52" height="1" fill="#FFFFFF" />
  <rect x="6" y="8" width="1" height="48" fill="#FFFFFF" />
  <rect x="57" y="8" width="1" height="48" fill="#000000" />
  <rect x="6" y="55" width="52" height="1" fill="#000000" />

  <!-- Title bar -->
  <rect x="8" y="10" width="48" height="9" fill="#000080" />
  <rect x="10" y="13" width="9" height="3" fill="#C0C0C0" />
  <rect x="50" y="12" width="4" height="4" fill="#C0C0C0" />

  <!-- Terminal screen bezel -->
  <rect x="8" y="21" width="48" height="31" fill="#808080" />
  <rect x="8" y="21" width="48" height="1" fill="#FFFFFF" />
  <rect x="8" y="21" width="1" height="31" fill="#FFFFFF" />
  <rect x="55" y="21" width="1" height="31" fill="#404040" />
  <rect x="8" y="51" width="48" height="1" fill="#404040" />

  <!-- Terminal black area -->
  <rect x="11" y="24" width="42" height="25" fill="#000000" />

  <!-- C:\> prompt -->
  <rect x="14" y="29" width="2" height="2" fill="#00FF00" />
  <rect x="17" y="29" width="2" height="2" fill="#00FF00" />
  <rect x="19" y="31" width="2" height="2" fill="#00FF00" />
  <rect x="22" y="29" width="1" height="4" fill="#00FF00" />
  <rect x="24" y="31" width="2" height="1" fill="#00FF00" />

  <!-- Cursor -->
  <rect x="30" y="39" width="7" height="2" fill="#00FF00" />
</svg>
